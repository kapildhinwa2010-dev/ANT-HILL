[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-hill"
version = "0.1.0"
description = "Pour a topological liquid into an AI, freeze it, and read the full 3D map: occupancy mold + logit-lens labels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kapil Dhinwa" }]
dependencies = [
  "torch",
  "transformers",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
